<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>创飞科技 · 2026 招新海报</title>
<meta name="description" content="山东理工大学创飞科技无人机社团 2026 招新海报，潮流街头喷漆涂鸦风格。" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon: #39ff14;
    --orange: #ff6b00;
    --ink: #0a0a0a;
    --panel: #141414;
    --text: #f2f5f0;
    --muted: #9aa39a;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--ink);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ---------- 背景：喷漆颗粒 + 网格 ---------- */
  .bg-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bg-grid {
    background-image:
      linear-gradient(rgba(57,255,20,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,0.05) 1px, transparent 1px);
    background-size: 62px 62px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 100%);
  }
  .bg-grain {
    opacity: 0.4;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(57,255,20,0.16), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(255,107,0,0.18), transparent 46%),
      radial-gradient(circle at 78% 82%, rgba(57,255,20,0.10), transparent 40%),
      radial-gradient(circle at 8% 88%, rgba(255,107,0,0.12), transparent 44%);
  }

  /* 喷漆飞溅点 */
  .splat {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(46px);
    opacity: 0.34;
  }
  .splat.a { width: 320px; height: 320px; background: var(--neon); top: -90px; left: -80px; }
  .splat.b { width: 300px; height: 300px; background: var(--orange); bottom: -80px; right: -70px; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 22px 80px;
  }

  /* ---------- 顶部 ---------- */
  header {
    padding: 58px 0 44px;
    text-align: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 34px;
    padding: 12px 26px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(57,255,20,0.30);
    border-radius: 6px;
    backdrop-filter: blur(10px);
    box-shadow: 4px 4px 0 rgba(255,107,0,0.55);
  }
  .brand img.logo { width: 108px; display: block; }
  .brand .divider {
    width: 1px; height: 30px;
    background: rgba(255,255,255,0.18);
  }
  .brand img.school {
    width: 38px; height: 38px;
    object-fit: contain;
    background: #fff;
    border-radius: 50%;
    padding: 3px;
  }

  .eyebrow {
    display: inline-block;
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--neon);
    padding: 5px 16px;
    margin-bottom: 20px;
    transform: rotate(-1.5deg);
    box-shadow: 4px 4px 0 var(--orange);
  }

  h1 {
    font-size: clamp(36px, 6.6vw, 64px);
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1.1;
    margin-bottom: 22px;
    text-shadow: 4px 4px 0 var(--orange);
  }
  h1 .hl {
    color: var(--neon);
    text-shadow: 4px 4px 0 rgba(255,107,0,0.85);
  }

  .slogan {
    display: inline-block;
    font-size: clamp(14px, 2.3vw, 18px);
    letter-spacing: 3px;
    color: var(--text);
    padding: 10px 26px;
    background: rgba(0,0,0,0.5);
    border-left: 4px solid var(--neon);
    backdrop-filter: blur(6px);
  }

  .meta {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .chip {
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 4px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--muted);
    letter-spacing: 1px;
  }
  .chip.hot {
    color: var(--neon);
    border-color: rgba(57,255,20,0.45);
    background: rgba(57,255,20,0.09);
  }

  /* ---------- 海报主区 ---------- */
  .showcase {
    display: flex;
    justify-content: center;
    margin-top: 6px;
  }

  .poster-card {
    position: relative;
    width: 100%;
    max-width: 660px;
    background: linear-gradient(180deg, var(--panel), #0d0d0d);
    border: 2px solid rgba(57,255,20,0.35);
    border-radius: 8px;
    padding: 20px;
    box-shadow:
      10px 10px 0 rgba(255,107,0,0.55),
      0 30px 80px rgba(0,0,0,0.7);
  }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 4px;
    background: #000;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .frame iframe {
    position: absolute;
    top: 0; left: 0;
    width: 750px;
    height: 1000px;
    border: 0;
    transform-origin: top left;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  /* 缩放到容器宽度后再显示，避免未缩放时的尺寸闪烁 */
  .frame.is-fit iframe { opacity: 1; }

  /* 角标 */
  .frame::after {
    content: '2026 RECRUITMENT';
    position: absolute;
    left: 12px;
    bottom: 12px;
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--ink);
    background: var(--neon);
    border-radius: 2px;
    padding: 4px 9px;
  }

  .card-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 14px 18px;
    border-radius: 6px;
    transition: background 0.25s, color 0.25s, border-color 0.25s, box-shadow 0.25s, transform 0.25s;
  }
  .btn.primary {
    background: var(--neon);
    color: var(--ink);
    box-shadow: 5px 5px 0 var(--orange);
  }
  .btn.primary:hover {
    background: #fff;
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 var(--orange);
  }

  /* ---------- 信息条 ---------- */
  .specs {
    margin-top: 58px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .spec {
    padding: 22px 24px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-left: 4px solid var(--neon);
    border-radius: 4px;
  }
  .spec:nth-child(2) { border-left-color: var(--orange); }
  .spec:nth-child(3) { border-left-color: var(--neon); }
  .spec .label {
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--neon);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .spec:nth-child(2) .label { color: var(--orange); }
  .spec .value {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.55;
    color: var(--text);
  }
  .spec .sub {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .noscript-hint {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    color: var(--muted);
    padding: 12px 16px;
    border: 1px dashed rgba(255,255,255,0.18);
    border-radius: 6px;
  }
  .noscript-hint a { color: var(--neon); }

  /* ---------- 打印 ---------- */
  @media print {
    .bg-layer, .splat, .specs, .meta, footer, .card-actions { display: none !important; }
    body { background: #fff; color: #000; }
    .wrap { padding: 0; max-width: none; }
    header { padding: 0 0 16px; }
    h1, h1 .hl { color: #000; text-shadow: none; }
    .poster-card { border: 0; box-shadow: none; padding: 0; background: none; }
    .frame { box-shadow: none; }
    .frame::after { display: none; }
    .brand, .slogan, .eyebrow { color: #000; box-shadow: none; background: none; }
  }

  /* ---------- 底部 ---------- */
  footer {
    margin-top: 60px;
    padding-top: 34px;
    border-top: 1px solid rgba(255,255,255,0.09);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
  }
  .office {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 12px 22px;
    border-radius: 6px;
    background: rgba(255,107,0,0.14);
    border: 2px dashed rgba(255,107,0,0.6);
  }
  .office .k {
    color: var(--orange);
    font-size: 13px;
  }
  .footnote {
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 12px;
    color: #6f776f;
    letter-spacing: 2px;
  }

  @media (max-width: 640px) {
    header { padding: 40px 0 32px; }
    .brand { padding: 10px 18px; gap: 12px; }
    .brand img.logo { width: 84px; }
    .poster-card { padding: 14px; box-shadow: 6px 6px 0 rgba(255,107,0,0.55); }
    footer { justify-content: center; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .frame iframe { transition: none; }
    .btn { transition: none; }
    .btn.primary:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="bg-layer bg-grid"></div>
  <div class="bg-layer bg-grain"></div>
  <div class="splat a"></div>
  <div class="splat b"></div>

  <div class="wrap">
    <header>
      <div class="brand">
        <img class="logo" src="assets/logo-chuangfei-opt.png" alt="创飞科技" width="480" height="480" />
        <span class="divider"></span>
        <img class="school" src="assets/logo-university.png" alt="山东理工大学" />
      </div>

      <div class="eyebrow">CREFLY TECH · 2026 RECRUITMENT</div>
      <h1>创飞科技 <span class="hl">招新海报</span></h1>
      <div class="slogan">我们和你一样，向往这片蓝天</div>

      <div class="meta">
        <span class="chip hot">2026 招新</span>
        <span class="chip">山东理工大学</span>
        <span class="chip">唯一职业化无人机团队</span>
      </div>
    </header>

    <main class="showcase">
      <article class="poster-card">
        <div class="frame">
          <iframe src="poster-cool.html" scrolling="no" loading="lazy" tabindex="-1" title="创飞科技招新海报预览"></iframe>
        </div>
        <noscript>
          <p class="noscript-hint">当前浏览器未启用 JavaScript，预览图无法自适应缩放，请直接<a href="poster-cool.html">打开完整海报</a>。</p>
        </noscript>
        <div class="card-actions">
          <a class="btn primary" href="poster-cool.html" target="_blank" rel="noopener">查看完整海报</a>
        </div>
      </article>
    </main>

    <section class="specs">
      <div class="spec">
        <div class="label">Visual</div>
        <div class="value">潮流街头喷漆风</div>
        <div class="sub">荧光绿 + 亮橙 + 纯黑撞色，涂鸦飞溅</div>
      </div>
      <div class="spec">
        <div class="label">Size</div>
        <div class="value">750 × 1000 px</div>
        <div class="sub">3:4 竖版 · 线上传播与打印通用</div>
      </div>
      <div class="spec">
        <div class="label">Office</div>
        <div class="value">大红炉共创空间 203</div>
        <div class="sub">海报底部预留三个二维码位置</div>
      </div>
    </section>

    <footer>
      <div class="office">
        <span class="k">办公室</span>
        大红炉共创空间 203
      </div>
      <div class="footnote">CREFLY TECH · JOIN THE SKY</div>
    </footer>
  </div>

  <script>
    (function () {
      var POSTER_W = 750;

      function fit(frame) {
        var iframe = frame.querySelector('iframe');
        if (!iframe) return;
        var scale = frame.clientWidth / POSTER_W;
        iframe.style.transform = 'scale(' + scale + ')';
        frame.classList.add('is-fit');
      }

      function fitAll() {
        document.querySelectorAll('.frame').forEach(fit);
      }

      window.addEventListener('resize', fitAll);
      window.addEventListener('load', fitAll);
      fitAll();

      if (window.ResizeObserver) {
        var ro = new ResizeObserver(function (entries) {
          entries.forEach(function (e) { fit(e.target); });
        });
        document.querySelectorAll('.frame').forEach(function (f) { ro.observe(f); });
      }
    })();
  </script>
</body>
</html>
