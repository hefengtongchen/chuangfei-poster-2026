<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>创飞科技 · 2026 招新海报</title>
<meta name="description" content="山东理工大学创飞科技无人机社团 2026 招新海报，赛博科技风格主视觉。" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon: #39ff14;
    --orange: #ff6b00;
    --cyan: #00e5ff;
    --violet: #7a6cff;
    --bg: #06070d;
    --panel: #0d1020;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: #eaf0ff;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ---------- 背景氛围 ---------- */
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -10%, rgba(90,60,255,0.30), transparent 70%),
      linear-gradient(rgba(0,229,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 58px 58px, 58px 58px;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.20;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow.a { background: var(--cyan); width: 560px; height: 560px; top: -200px; left: -160px; }
  .bg-glow.b { background: var(--neon); width: 520px; height: 520px; bottom: -240px; right: -180px; }

  .spotlight {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 1px; height: 1px;
    box-shadow: 0 0 600px 200px rgba(0,229,255,0.10);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 22px 80px;
  }

  /* ---------- 顶部 ---------- */
  header {
    padding: 60px 0 46px;
    text-align: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    padding: 12px 26px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0,229,255,0.28);
    border-radius: 60px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,229,255,0.10);
  }
  .brand img.logo { width: 108px; display: block; }
  .brand .divider {
    width: 1px; height: 30px;
    background: rgba(255,255,255,0.16);
  }
  .brand img.school {
    width: 38px; height: 38px;
    object-fit: contain;
    background: #fff;
    border-radius: 50%;
    padding: 3px;
  }

  .eyebrow {
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--neon);
    text-transform: uppercase;
    margin-bottom: 16px;
    text-shadow: 0 0 18px rgba(57,255,20,0.6);
  }

  h1 {
    font-size: clamp(34px, 6.2vw, 60px);
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1.12;
    margin-bottom: 20px;
  }
  h1 .hl {
    background: linear-gradient(120deg, var(--cyan), var(--neon));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .slogan {
    display: inline-block;
    font-size: clamp(14px, 2.3vw, 18px);
    letter-spacing: 3px;
    color: #c2d3e8;
    padding: 10px 28px;
    border: 1px solid rgba(0,229,255,0.42);
    border-radius: 40px;
    background: rgba(0,229,255,0.06);
    box-shadow: inset 0 0 24px rgba(0,229,255,0.10);
  }

  .meta {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .chip {
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 30px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    color: #a9b6cc;
    letter-spacing: 1px;
  }
  .chip.hot {
    color: var(--neon);
    border-color: rgba(57,255,20,0.42);
    background: rgba(57,255,20,0.08);
    box-shadow: 0 0 18px rgba(57,255,20,0.16);
  }

  /* ---------- 海报主区 ---------- */
  .showcase {
    display: flex;
    justify-content: center;
    margin-top: 6px;
  }

  .poster-card {
    position: relative;
    width: 100%;
    max-width: 660px;
    background: linear-gradient(180deg, var(--panel), #080a14);
    border: 1px solid rgba(0,229,255,0.22);
    border-radius: 20px;
    padding: 20px;
    box-shadow:
      0 30px 90px rgba(0,0,0,0.65),
      0 0 0 1px rgba(0,229,255,0.06),
      0 0 70px rgba(0,229,255,0.08);
  }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 12px 36px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .frame iframe {
    position: absolute;
    top: 0; left: 0;
    width: 750px;
    height: 1000px;
    border: 0;
    transform-origin: top left;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  /* 缩放到容器宽度后再显示，避免未缩放时的尺寸闪烁 */
  .frame.is-fit iframe { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .frame iframe { transition: none; }
    .btn { transition: none; }
  }

  /* 角标 */
  .frame::after {
    content: '2026 RECRUITMENT';
    position: absolute;
    left: 12px;
    bottom: 12px;
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.55);
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 4px;
    padding: 4px 9px;
    backdrop-filter: blur(6px);
  }

  .card-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 14px 18px;
    border-radius: 10px;
    transition: background 0.25s, color 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .btn.primary {
    background: linear-gradient(90deg, var(--cyan), var(--neon));
    color: #06070d;
    box-shadow: 0 6px 26px rgba(0,229,255,0.30);
  }
  .btn.primary:hover {
    background: #fff;
    box-shadow: 0 6px 30px rgba(255,255,255,0.25);
  }
  .btn.ghost {
    flex: 0 0 auto;
    color: #c3cfe2;
    border: 1px solid rgba(255,255,255,0.16);
  }
  .btn.ghost:hover {
    border-color: var(--neon);
    color: var(--neon);
    box-shadow: 0 0 20px rgba(57,255,20,0.18);
  }

  /* ---------- 信息条 ---------- */
  .specs {
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .spec {
    padding: 22px 24px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }
  .spec::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, var(--cyan), transparent);
  }
  .spec:nth-child(2)::before { background: linear-gradient(90deg, var(--neon), transparent); }
  .spec:nth-child(3)::before { background: linear-gradient(90deg, var(--orange), transparent); }
  .spec .label {
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--cyan);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .spec:nth-child(2) .label { color: var(--neon); }
  .spec:nth-child(3) .label { color: var(--orange); }
  .spec .value {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.55;
    color: #eaf0ff;
  }
  .spec .sub {
    margin-top: 6px;
    font-size: 12.5px;
    color: #8b98b0;
    letter-spacing: 0.5px;
  }

  .noscript-hint {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    color: #a9b6cc;
    padding: 12px 16px;
    border: 1px dashed rgba(255,255,255,0.18);
    border-radius: 10px;
  }
  .noscript-hint a { color: var(--neon); }

  /* ---------- 打印 ---------- */
  @media print {
    .bg-grid, .bg-glow, .spotlight, .specs, .meta, footer, .card-actions { display: none !important; }
    body { background: #fff; color: #000; }
    .wrap { padding: 0; max-width: none; }
    header { padding: 0 0 16px; }
    h1, h1 .hl { color: #000; -webkit-text-fill-color: #000; background: none; }
    .poster-card { border: 0; box-shadow: none; padding: 0; background: none; }
    .frame { box-shadow: none; }
    .frame::after { display: none; }
    .brand, .slogan, .eyebrow { color: #000; }
  }

  /* ---------- 底部 ---------- */
  footer {
    margin-top: 60px;
    padding-top: 34px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
  }
  .office {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 12px 22px;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(0,229,255,0.14), rgba(57,255,20,0.12));
    border: 1px solid rgba(0,229,255,0.30);
  }
  .office .k {
    color: var(--cyan);
    font-size: 13px;
  }
  .footnote {
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 12px;
    color: #6c7893;
    letter-spacing: 2px;
  }

  @media (max-width: 640px) {
    header { padding: 40px 0 32px; }
    .brand { padding: 10px 18px; gap: 12px; }
    .brand img.logo { width: 84px; }
    .poster-card { padding: 14px; border-radius: 16px; }
    .card-actions { flex-direction: column; }
    .btn.ghost { flex: 1; }
    footer { justify-content: center; text-align: center; }
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow a"></div>
  <div class="bg-glow b"></div>
  <div class="spotlight"></div>

  <div class="wrap">
    <header>
      <div class="brand">
        <img class="logo" src="assets/logo-chuangfei-opt.png" alt="创飞科技" width="480" height="480" />
        <span class="divider"></span>
        <img class="school" src="assets/logo-university.png" alt="山东理工大学" />
      </div>

      <div class="eyebrow">CREFLY TECH · 2026 RECRUITMENT</div>
      <h1>创飞科技 <span class="hl">招新海报</span></h1>
      <div class="slogan">我们和你一样，向往这片蓝天</div>

      <div class="meta">
        <span class="chip hot">2026 招新</span>
        <span class="chip">山东理工大学</span>
        <span class="chip">唯一职业化无人机团队</span>
      </div>
    </header>

    <main class="showcase">
      <article class="poster-card">
        <div class="frame">
          <iframe src="poster-cyber.html" scrolling="no" loading="lazy" tabindex="-1" title="创飞科技招新海报预览"></iframe>
        </div>
        <noscript>
          <p class="noscript-hint">当前浏览器未启用 JavaScript，预览图无法自适应缩放，请直接<a href="poster-cyber.html">打开完整海报</a>。</p>
        </noscript>
        <div class="card-actions">
          <a class="btn primary" href="poster-cyber.html" target="_blank" rel="noopener">查看完整海报</a>
        </div>
      </article>
    </main>

    <section class="specs">
      <div class="spec">
        <div class="label">Visual</div>
        <div class="value">赛博科技风格</div>
        <div class="sub">深空蓝紫底 · 霓虹青与荧光绿双主色</div>
      </div>
      <div class="spec">
        <div class="label">Size</div>
        <div class="value">750 × 1000 px</div>
        <div class="sub">3:4 竖版 · 线上传播与打印通用</div>
      </div>
      <div class="spec">
        <div class="label">Office</div>
        <div class="value">大红炉共创空间 203</div>
        <div class="sub">海报底部预留三个二维码位置</div>
      </div>
    </section>

    <footer>
      <div class="office">
        <span class="k">办公室</span>
        大红炉共创空间 203
      </div>
      <div class="footnote">CREFLY TECH · JOIN THE SKY</div>
    </footer>
  </div>

  <script>
    (function () {
      var POSTER_W = 750, POSTER_H = 1000;

      function fit(frame) {
        var iframe = frame.querySelector('iframe');
        if (!iframe) return;
        var scale = frame.clientWidth / POSTER_W;
        iframe.style.transform = 'scale(' + scale + ')';
        frame.classList.add('is-fit');
      }

      function fitAll() {
        document.querySelectorAll('.frame').forEach(fit);
      }

      window.addEventListener('resize', fitAll);
      window.addEventListener('load', fitAll);
      fitAll();

      if (window.ResizeObserver) {
        var ro = new ResizeObserver(function (entries) {
          entries.forEach(function (e) { fit(e.target); });
        });
        document.querySelectorAll('.frame').forEach(function (f) { ro.observe(f); });
      }
    })();
  </script>
</body>
</html>
