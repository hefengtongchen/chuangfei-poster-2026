<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>创飞科技招新海报 · 赛博科技版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif;
    background: #06070d;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px;
  }

  .poster {
    position: relative;
    width: 750px;
    height: 1000px;
    overflow: hidden;
    color: #fff;
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, #1b1150 0%, #0b0d24 45%, #06070d 100%);
  }

  /* ---------- 赛博网格地面 ---------- */
  .grid-floor {
    position: absolute;
    left: -25%;
    right: -25%;
    bottom: 0;
    height: 46%;
    background-image:
      linear-gradient(rgba(0,229,255,0.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.35) 1px, transparent 1px);
    background-size: 60px 42px;
    transform: perspective(420px) rotateX(66deg);
    transform-origin: bottom center;
    mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%);
    opacity: 0.75;
    z-index: 0;
  }

  /* 地平线光带 */
  .horizon {
    position: absolute;
    left: 0; right: 0;
    top: 46%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #00e5ff 20%, #39ff14 50%, #00e5ff 80%, transparent);
    box-shadow: 0 0 30px rgba(0,229,255,0.8), 0 0 60px rgba(57,255,20,0.4);
    z-index: 1;
  }

  /* 顶部光晕 */
  .top-glow {
    position: absolute;
    top: -160px; left: 50%;
    transform: translateX(-50%);
    width: 620px; height: 380px;
    background: radial-gradient(ellipse, rgba(88,60,255,0.55), transparent 68%);
    filter: blur(20px);
    z-index: 0;
  }

  /* 扫描线 */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 4px);
    pointer-events: none;
    z-index: 6;
    mix-blend-mode: overlay;
  }

  /* ---------- 无人机 SVG ---------- */
  .drone-wrap {
    position: absolute;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    z-index: 2;
    filter: drop-shadow(0 0 22px rgba(0,229,255,0.65));
  }
  .drone-wrap svg { width: 100%; display: block; }

  .rotor-spin {
    transform-origin: center;
    animation: spin 0.55s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 内容容器 ---------- */
  .content {
    position: relative;
    z-index: 5;
    height: 100%;
    padding: 26px 34px 30px;
    display: flex;
    flex-direction: column;
  }

  /* 顶部栏 */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .sys-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #00e5ff;
    opacity: 0.85;
    line-height: 1.7;
  }
  .sys-tag .on { color: #39ff14; }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-cf { width: 96px; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.6)); }
  .logo-school {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.94);
    padding: 3px;
    box-shadow: 0 0 14px rgba(0,229,255,0.5);
  }
  .logo-school img { width: 100%; height: 100%; object-fit: contain; }

  /* 主标题 */
  .hero {
    margin-top: 196px;
    text-align: center;
  }
  .hero-en {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 7px;
    color: #39ff14;
    margin-bottom: 10px;
    text-shadow: 0 0 16px rgba(57,255,20,0.8);
  }
  .main-title {
    font-size: 78px;
    font-weight: 900;
    letter-spacing: 8px;
    line-height: 1;
    color: #fff;
    text-shadow:
      0 0 12px rgba(0,229,255,0.9),
      0 0 34px rgba(0,120,255,0.7),
      0 0 70px rgba(88,60,255,0.5);
  }
  .main-title-line {
    margin: 12px auto 0;
    width: 300px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00e5ff, #39ff14, transparent);
  }
  .slogan {
    display: inline-block;
    margin-top: 16px;
    padding: 8px 26px;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 3px;
    color: #d7f9ff;
    background: rgba(0,229,255,0.07);
    border: 1px solid rgba(0,229,255,0.45);
    border-radius: 3px;
    box-shadow: inset 0 0 22px rgba(0,229,255,0.18);
  }

  /* 分区通用 */
  .section { margin-top: 20px; }
  .section-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 11px;
  }
  .section-head .idx {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: #06070d;
    background: #39ff14;
    padding: 2px 7px;
    letter-spacing: 1px;
    box-shadow: 0 0 14px rgba(57,255,20,0.6);
  }
  .section-head .name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #eafcff;
  }
  .section-head .rule {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(0,229,255,0.55), transparent);
  }

  /* 社团内容 */
  .biz-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
  }
  .biz {
    padding: 13px 6px 11px;
    text-align: center;
    background: linear-gradient(180deg, rgba(0,229,255,0.10), rgba(0,229,255,0.03));
    border: 1px solid rgba(0,229,255,0.35);
    border-radius: 4px;
    position: relative;
  }
  .biz::after {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 26px; height: 2px;
    background: #00e5ff;
    box-shadow: 0 0 10px #00e5ff;
  }
  .biz .en {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: #00e5ff;
    opacity: 0.8;
    margin-bottom: 5px;
  }
  .biz .cn {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.3;
  }

  /* 部门 */
  .dept-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .dept {
    flex: 1;
    min-width: 0;
    text-align: center;
    padding: 11px 4px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #eafcff;
    background: rgba(10,20,45,0.65);
    border: 1px solid rgba(57,255,20,0.45);
    border-radius: 3px;
    clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
  }
  .dept:nth-child(2n) {
    border-color: rgba(0,229,255,0.5);
  }

  /* 荣誉 */
  .honor-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }
  .honor {
    padding: 12px 10px;
    background: linear-gradient(180deg, rgba(88,60,255,0.20), rgba(88,60,255,0.05));
    border: 1px solid rgba(120,110,255,0.45);
    border-radius: 4px;
    text-align: center;
  }
  .honor .star {
    font-size: 15px;
    color: #ffd34d;
    text-shadow: 0 0 12px rgba(255,211,77,0.8);
    display: block;
    margin-bottom: 6px;
  }
  .honor .txt {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.45;
    color: #e6e9ff;
  }

  /* 底部 */
  .bottom {
    margin-top: auto;
  }
  .office {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 10px;
    margin-bottom: 13px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #06070d;
    background: linear-gradient(90deg, #00e5ff, #39ff14);
    box-shadow: 0 0 24px rgba(0,229,255,0.45);
  }
  .office .k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    border: 1.5px solid #06070d;
    padding: 1px 6px;
    border-radius: 2px;
  }

  .qr-row {
    width: 546px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .qr {
    aspect-ratio: 1;
    background: #fff;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 0 1px rgba(0,229,255,0.6), 0 0 22px rgba(0,229,255,0.3);
  }
  .qr::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1.5px dashed #c2c8d4;
    border-radius: 3px;
  }
  .qr .ph {
    font-size: 12px;
    font-weight: 700;
    color: #9aa3b2;
    letter-spacing: 1px;
  }
  .qr .cap {
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #0b0d24;
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .footer-line {
    margin-top: 12px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 3px;
    color: rgba(150,200,255,0.5);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="top-glow"></div>
    <div class="grid-floor"></div>
    <div class="horizon"></div>
    <div class="scanlines"></div>

    <!-- 无人机主视觉 -->
    <div class="drone-wrap">
      <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="armGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7dfcff"/>
            <stop offset="100%" stop-color="#0b6fff"/>
          </linearGradient>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2b3f7a"/>
            <stop offset="100%" stop-color="#0a1330"/>
          </linearGradient>
        </defs>

        <!-- 机臂 -->
        <g stroke="url(#armGrad)" stroke-width="7" stroke-linecap="round" fill="none">
          <line x1="200" y1="100" x2="88" y2="52"/>
          <line x1="200" y1="100" x2="312" y2="52"/>
          <line x1="200" y1="100" x2="88" y2="148"/>
          <line x1="200" y1="100" x2="312" y2="148"/>
        </g>

        <!-- 旋翼 -->
        <g>
          <circle cx="88" cy="52" r="30" fill="rgba(0,229,255,0.10)" stroke="rgba(0,229,255,0.55)" stroke-width="1.5"/>
          <ellipse class="rotor-spin" cx="88" cy="52" rx="28" ry="4.5" fill="rgba(0,229,255,0.85)"/>
          <circle cx="312" cy="52" r="30" fill="rgba(0,229,255,0.10)" stroke="rgba(0,229,255,0.55)" stroke-width="1.5"/>
          <ellipse class="rotor-spin" cx="312" cy="52" rx="28" ry="4.5" fill="rgba(0,229,255,0.85)"/>
          <circle cx="88" cy="148" r="30" fill="rgba(57,255,20,0.10)" stroke="rgba(57,255,20,0.55)" stroke-width="1.5"/>
          <ellipse class="rotor-spin" cx="88" cy="148" rx="28" ry="4.5" fill="rgba(57,255,20,0.85)"/>
          <circle cx="312" cy="148" r="30" fill="rgba(57,255,20,0.10)" stroke="rgba(57,255,20,0.55)" stroke-width="1.5"/>
          <ellipse class="rotor-spin" cx="312" cy="148" rx="28" ry="4.5" fill="rgba(57,255,20,0.85)"/>
        </g>

        <!-- 机身 -->
        <rect x="164" y="74" width="72" height="52" rx="12" fill="url(#bodyGrad)" stroke="#7dfcff" stroke-width="2"/>
        <circle cx="200" cy="100" r="12" fill="none" stroke="#39ff14" stroke-width="2.5"/>
        <circle cx="200" cy="100" r="4" fill="#39ff14"/>
        <rect x="186" y="128" width="28" height="14" rx="5" fill="#0a1330" stroke="#7dfcff" stroke-width="1.5"/>
        <circle cx="200" cy="139" r="4" fill="#00e5ff"/>

        <!-- 信号波纹 -->
        <g fill="none" stroke="rgba(57,255,20,0.5)" stroke-width="1.5">
          <path d="M200 46 q 22 -18 44 0"/>
          <path d="M200 34 q 34 -28 68 0"/>
        </g>
      </svg>
    </div>

    <div class="content">
      <!-- 顶部 -->
      <div class="top-bar">
        <div class="sys-tag">
          SYS://CREFLY-2026<br/>
          STATUS: <span class="on">RECRUITING</span>
        </div>
        <div class="brand-group">
          <img class="logo-cf" src="assets/logo-chuangfei.png" alt="创飞科技" />
          <div class="logo-school">
            <img src="assets/logo-university.png" alt="山东理工大学" />
          </div>
        </div>
      </div>

      <!-- 主标题 -->
      <div class="hero">
        <div class="hero-en">CREFLY TECH</div>
        <h1 class="main-title">创飞科技</h1>
        <div class="main-title-line"></div>
        <div class="slogan">我们和你一样，向往这片蓝天</div>
      </div>

      <!-- 社团内容 -->
      <div class="section">
        <div class="section-head">
          <span class="idx">01</span>
          <span class="name">社团内容</span>
          <span class="rule"></span>
        </div>
        <div class="biz-grid">
          <div class="biz"><span class="en">AERIAL</span><span class="cn">摄影剪辑</span></div>
          <div class="biz"><span class="en">RURAL</span><span class="cn">三下乡<br/>社会实践</span></div>
          <div class="biz"><span class="en">COMPETE</span><span class="cn">科创比赛</span></div>
          <div class="biz"><span class="en">INDUSTRY</span><span class="cn">无人机<br/>行业应用</span></div>
        </div>
      </div>

      <!-- 部门 -->
      <div class="section">
        <div class="section-head">
          <span class="idx">02</span>
          <span class="name">五大部门</span>
          <span class="rule"></span>
        </div>
        <div class="dept-row">
          <div class="dept">技术部</div>
          <div class="dept">实验部</div>
          <div class="dept">外联部</div>
          <div class="dept">宣传部</div>
          <div class="dept">赛创部</div>
        </div>
      </div>

      <!-- 荣誉 -->
      <div class="section">
        <div class="section-head">
          <span class="idx">03</span>
          <span class="name">社团荣誉</span>
          <span class="rule"></span>
        </div>
        <div class="honor-grid">
          <div class="honor">
            <span class="star">★</span>
            <div class="txt">山东理工大学<br/>明星社团</div>
          </div>
          <div class="honor">
            <span class="star">★</span>
            <div class="txt">山东省三下乡<br/>优秀服务团队</div>
          </div>
          <div class="honor">
            <span class="star">★</span>
            <div class="txt">全国科技<br/>志愿服务团队</div>
          </div>
        </div>
      </div>

      <!-- 底部 -->
      <div class="bottom">
        <div class="office">
          <span class="k">LOC</span>
          办公室 · 大红炉共创空间 203
        </div>
        <div class="qr-row">
          <div class="qr">
            <span class="ph">扫码进群</span>
            <span class="cap">纳新群①</span>
          </div>
          <div class="qr">
            <span class="ph">扫码进群</span>
            <span class="cap">纳新群②</span>
          </div>
          <div class="qr">
            <span class="ph">扫码咨询</span>
            <span class="cap">负责人</span>
          </div>
        </div>
        <div class="footer-line">CREFLY TECH · JOIN THE SKY · 2026</div>
      </div>
    </div>
  </div>
</body>
</html>
