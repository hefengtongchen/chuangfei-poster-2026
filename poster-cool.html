<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>创飞科技招新海报 · 酷炫炸街版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0;
  }

  /* 固定 750×1000 画稿：窄屏等比缩放，保证版式不变形 */
  .stage {
    position: relative;
    flex-shrink: 0;
  }

  .poster {
    position: relative;
    width: 750px;
    min-height: 1000px;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    color: #fff;
    background: #0a0a0a;
    transform-origin: top left;
  }

  /* 背景图 */
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('assets/bg-cool.jpg');
    background-size: cover;
    background-position: center;
    z-index: 0;
  }

  /* 暗化渐变，保证文字可读 */
  .overlay-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 55%;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0) 100%);
    z-index: 1;
  }
  .overlay-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 55%;
    background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0) 100%);
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 36px 38px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* 顶部 Logo 区 */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }
  .top-bar .logo-cf {
    width: 120px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }
  .top-bar .logo-school {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    padding: 4px;
    opacity: 0.9;
  }
  .top-bar .logo-school img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* 主标题区 */
  .title-area {
    margin-bottom: 28px;
  }
  .subtitle-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    color: #39ff14;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(57,255,20,0.5);
  }
  .main-title {
    font-size: 72px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 4px;
    color: #fff;
    position: relative;
    display: inline-block;
    text-shadow:
      4px 4px 0 #ff6b00,
      8px 8px 0 rgba(57,255,20,0.4),
      0 0 40px rgba(57,255,20,0.3);
    transform: skew(-3deg);
  }
  .main-title::before {
    content: '';
    position: absolute;
    bottom: -4px;
    left: -8px;
    right: -8px;
    height: 14px;
    background: #ff6b00;
    z-index: -1;
    transform: skew(-8deg);
    opacity: 0.9;
  }
  .slogan {
    margin-top: 18px;
    font-size: 22px;
    font-weight: 500;
    color: #fff;
    letter-spacing: 2px;
    position: relative;
    display: inline-block;
    padding: 6px 16px;
    background: rgba(0,0,0,0.5);
    border-left: 4px solid #39ff14;
    backdrop-filter: blur(4px);
  }

  /* 喷漆装饰元素 */
  .spray-tag {
    position: absolute;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 4px 10px;
    background: #39ff14;
    color: #000;
    transform: rotate(-4deg);
    top: 140px;
    right: 30px;
    box-shadow: 3px 3px 0 #ff6b00;
  }
  .spray-tag.orange {
    background: #ff6b00;
    color: #000;
    top: 180px;
    right: 80px;
    transform: rotate(3deg);
    box-shadow: 3px 3px 0 #39ff14;
  }

  /* 业务内容区 - 贴纸标签风格 */
  .section-title {
    font-size: 18px;
    font-weight: 700;
    color: #39ff14;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: '';
    width: 6px;
    height: 22px;
    background: #ff6b00;
    display: inline-block;
    transform: skew(-6deg);
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, rgba(57,255,20,0.5), transparent);
  }

  .biz-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
  }
  .biz-tag {
    padding: 8px 18px;
    background: rgba(57,255,20,0.15);
    border: 2px solid #39ff14;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
    position: relative;
    transform: rotate(-1deg);
    transition: transform 0.2s;
  }
  .biz-tag:nth-child(2n) {
    transform: rotate(1.5deg);
    background: rgba(255,107,0,0.15);
    border-color: #ff6b00;
  }
  .biz-tag:nth-child(3n) {
    transform: rotate(-2deg);
  }
  .biz-tag::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: inherit;
    filter: blur(8px);
    opacity: 0.3;
    z-index: -1;
  }

  /* 部门区 */
  .dept-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 26px;
  }
  .dept-item {
    text-align: center;
    padding: 10px 4px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    position: relative;
  }
  .dept-item:nth-child(odd) {
    border-top: 3px solid #39ff14;
  }
  .dept-item:nth-child(even) {
    border-top: 3px solid #ff6b00;
  }

  /* 荣誉区 */
  .honors {
    margin-bottom: 26px;
  }
  .honor-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .honor-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.4);
    border-left: 3px solid #ff6b00;
    backdrop-filter: blur(4px);
    font-size: 14px;
    font-weight: 500;
  }
  .honor-item .medal {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 900;
    color: #000;
  }
  .honor-item:nth-child(2) { border-left-color: #39ff14; }
  .honor-item:nth-child(2) .medal { background: linear-gradient(135deg, #39ff14, #00b300); }
  .honor-item:nth-child(3) { border-left-color: #00bfff; }
  .honor-item:nth-child(3) .medal { background: linear-gradient(135deg, #00bfff, #0066cc); }

  /* 底部：办公室 + 二维码 */
  .bottom-area {
    margin-top: auto;
  }
  .office-info {
    text-align: center;
    margin-bottom: 16px;
    padding: 10px;
    background: rgba(255,107,0,0.2);
    border: 2px dashed #ff6b00;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .office-info .label {
    font-size: 12px;
    color: #ff6b00;
    margin-right: 8px;
    font-weight: 500;
  }

  .qr-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .qr-box {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.95);
    border: 3px solid #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #333;
    position: relative;
  }
  .qr-box::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 2px dashed #999;
    pointer-events: none;
  }
  .qr-box .qr-placeholder {
    font-size: 13px;
    font-weight: 700;
    color: #666;
    text-align: center;
    letter-spacing: 1px;
  }
  .qr-box .qr-label {
    font-size: 12px;
    color: #ff6b00;
    font-weight: 700;
    margin-top: 6px;
  }

  /* 喷漆装饰点 */
  .splat {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
  }
  .splat-1 {
    width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(57,255,20,0.6), transparent 70%);
    top: 120px; left: -20px;
    filter: blur(4px);
  }
  .splat-2 {
    width: 60px; height: 60px;
    background: radial-gradient(circle, rgba(255,107,0,0.7), transparent 70%);
    bottom: 200px; right: -10px;
    filter: blur(3px);
  }

  /* 喷漆滴淌效果 */
  .drip {
    position: absolute;
    top: 0;
    width: 4px;
    background: linear-gradient(180deg, #39ff14, transparent);
    z-index: 3;
    pointer-events: none;
  }
  .drip-1 { left: 8%; height: 60px; }
  .drip-2 { left: 25%; height: 40px; background: linear-gradient(180deg, #ff6b00, transparent); }
  .drip-3 { right: 15%; height: 50px; }

  /* 角落贴纸 */
  .corner-sticker {
    position: absolute;
    z-index: 3;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 6px 12px;
    background: #ff6b00;
    color: #000;
    font-weight: 700;
    transform: rotate(-90deg);
    transform-origin: bottom right;
    bottom: 0;
    right: 0;
    box-shadow: -2px -2px 0 #39ff14;
  }
</style>
</head>
<body>
  <div class="stage">
  <div class="poster">
    <!-- 背景 -->
    <div class="bg"></div>
    <div class="overlay-top"></div>
    <div class="overlay-bottom"></div>

    <!-- 装饰元素 -->
    <div class="splat splat-1"></div>
    <div class="splat splat-2"></div>
    <div class="drip drip-1"></div>
    <div class="drip drip-2"></div>
    <div class="drip drip-3"></div>

    <div class="content">
      <!-- 顶部 Logo -->
      <div class="top-bar">
        <img class="logo-cf" src="assets/logo-chuangfei-opt.png" alt="创飞科技" width="480" height="480" />
        <div class="logo-school">
          <img src="assets/logo-university.png" alt="山东理工大学" />
        </div>
      </div>

      <!-- 主标题 -->
      <div class="title-area">
        <div class="subtitle-en">CREFLY TECH · RECRUITMENT 2026</div>
        <h1 class="main-title">创飞科技<br/>招新啦！</h1>
        <div class="slogan">我们和你一样 向往这片蓝天</div>
      </div>
    </div>

    <!-- 贴纸标签 -->
    <div class="spray-tag">2017 EST.</div>
    <div class="spray-tag orange">DRONE CLUB</div>

    <!-- 内容区（下半部分） -->
    <div class="content" style="position: absolute; bottom: 0; left: 0; right: 0; padding-top: 0; z-index: 2;">
      <div style="flex: 1;"></div>

      <!-- 业务内容 -->
      <div>
        <div class="section-title">社团内容</div>
        <div class="biz-tags">
          <div class="biz-tag">📸 摄影剪辑</div>
          <div class="biz-tag">🌾 三下乡社会实践</div>
          <div class="biz-tag">🏆 科创比赛</div>
          <div class="biz-tag">🚁 无人机行业应用</div>
        </div>
      </div>

      <!-- 部门 -->
      <div>
        <div class="section-title">五大部门</div>
        <div class="dept-grid">
          <div class="dept-item">技术部</div>
          <div class="dept-item">实验部</div>
          <div class="dept-item">外联部</div>
          <div class="dept-item">宣传部</div>
          <div class="dept-item">赛创部</div>
        </div>
      </div>

      <!-- 荣誉 -->
      <div class="honors">
        <div class="section-title">社团荣誉</div>
        <div class="honor-list">
          <div class="honor-item">
            <div class="medal">★</div>
            <span>山东理工大学明星社团</span>
          </div>
          <div class="honor-item">
            <div class="medal">★</div>
            <span>山东省三下乡优秀服务团队</span>
          </div>
          <div class="honor-item">
            <div class="medal">★</div>
            <span>全国科技志愿服务团队</span>
          </div>
        </div>
      </div>

      <!-- 底部：办公室 + 二维码 -->
      <div class="bottom-area">
        <div class="office-info">
          <span class="label">📍 办公室</span>
          大红炉共创空间 203
        </div>
        <div class="qr-row">
          <div class="qr-box">
            <div class="qr-placeholder">扫码进群</div>
            <div class="qr-label">纳新群①</div>
          </div>
          <div class="qr-box">
            <div class="qr-placeholder">扫码进群</div>
            <div class="qr-label">纳新群②</div>
          </div>
          <div class="qr-box">
            <div class="qr-placeholder">扫码咨询</div>
            <div class="qr-label">负责人</div>
          </div>
        </div>
      </div>
    </div>

    <div class="corner-sticker">JOIN US</div>
  </div>
  </div>

  <script>
    (function () {
      var POSTER_W = 750, POSTER_H = 1000;

      function fit() {
        var stage = document.querySelector('.stage');
        var poster = document.querySelector('.poster');
        if (!stage || !poster) return;
        var scale = Math.min(1, window.innerWidth / POSTER_W);
        poster.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
        stage.style.width = Math.round(POSTER_W * scale) + 'px';
        stage.style.height = Math.round(POSTER_H * scale) + 'px';
      }

      window.addEventListener('resize', fit);
      window.addEventListener('load', fit);
      fit();
    })();
  </script>
</body>
</html>
